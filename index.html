const money = cents => (cents<0?'−':'')+'$'+new Intl.NumberFormat(state?.settings?.format==='us'?'en-US':'de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(cents)/100);
const percent = value => new Intl.NumberFormat('es-EC',{maximumFractionDigits:1}).format(value)+'%';

function cents(value, allowZero=true) {
  const text = String(value).trim().replace(',','.');
  if(!/^\d+(\.\d{1,2})?$/.test(text)) throw Error('Escribe un monto válido, con hasta dos decimales.');

  const result = Number(whole)*100 + Number(fraction.padEnd(2,'0'));

function balances(s=state,through=null){if(s.version>=3)return cashBook(s,through?lastDate(through):null).balances;const result=Object.fromEntries(allFunds(s).map(f=>[f,openingFund(f,s)]));for(const t of s.transactions){if(through&&t.date.slice(0,7)>through)continue;if(t.type==='saving')result[t.to]+=t.amount;if(t.type==='transfer'){result[t.from]-=t.amount;result[t.to]+=t.amount;}if(t.type==='expense'&&t.from)result[t.from]-=t.amount;}return result;}

 '<section class="card section-space"><div class="card-head"><div><h2>Un hogar, paso a paso</h2><p>Las metas que estamos construyendo</p></div><button class="link-btn" data-page="goals">Ver todas '+icon('chevron',14)+'</button></div><div class="home-goals-grid">'+state.goals.slice(0,2).map(goalPreview).join('')+(state.goals.length===0?empty('Nuestra próxima meta','Una idea de hoy puede ser el hogar de mañana.','new-goal','Crear una meta'):'')+'</div></section>'+
 '<div class="grid cols3 section-space"><section class="card soft-card"><div class="goal-row"><span class="tile-icon green">'+icon('home')+'</span><h3>Renta que no pagamos</h3></div><div class="savings-number">'+money(b.rent)+'</div><p class="muted small">Acumulado real · '+money(m.budget.rent)+' previstos este mes</p><div class="divider"></div><div class="detail-line"><span class="small">En 12 meses, podríamos tener</span><strong>'+money(b.rent+m.budget.rent*12)+'</strong></div><button class="link-btn" data-page="savings">Construir patrimonio '+icon('right',15)+'</button></section><section class="card"><div class="goal-row"><span class="tile-icon blue">'+icon('shield')+'</span><h3>Un respaldo para los dos</h3></div><div class="savings-number">'+money(b.emergency)+'</div><p class="muted small">Fondo de emergencia · primer nivel '+money(100000)+'</p>'+progress(b.emergency/100000*100,'blue')+'<div class="progress-label"><span>'+percent(Math.min(100,b.emergency/100000*100))+' del primer nivel</span><span>Meta '+money(100000)+'</span></div><div class="section-space"><button class="link-btn" data-action="contribute" data-fund="emergency">Hacer un aporte '+icon('plus',15)+'</button></div></section><section class="card"><div class="card-head"><h2>Este mes</h2><span class="badge">Reservado</span></div>'+detail('Compras',money(m.budget.groceries),'cart')+detail('Moto',money(m.budget.gas+m.budget.maintenance),'bike')+detail('IESS',money(m.budget.iess1+m.budget.iess2),'shield')+detail('Dinero personal',money(t.personal),'wallet')+'</section></div>'+

function recommendations(t,b,grocery){let list='';const item=(ic,title,desc,action='')=>'<div class="recommendation"><span class="tile-icon green">'+icon(ic,18)+'</span><div><h3>'+title+'</h3><p>'+desc+'</p>'+action+'</div></div>';if(t.available<0)list+=item('alert','Recuperemos el equilibrio','Debes reducir '+money(-t.available)+' del presupuesto para mantenerlo equilibrado.');else if(t.available>0)list+=item('leaf','Tenemos '+money(t.available)+' sin asignar','Podemos darle un destino y acercarnos a nuestras metas.','<div class="actions" style="margin-top:10px">'+button('Enviar a emergencia','allocate','soft sm','','data-fund="emergency"')+button('Enviar a renta','allocate','secondary sm','','data-fund="rent"')+'</div>');if(b.emergency<100000)list+=item('shield','Un poco de tranquilidad','Tu siguiente prioridad debería ser fortalecer el fondo de emergencia.');if(grocery>month().budget.groceries)list+=item('cart','Revisemos las compras','Este mes las compras superaron el presupuesto en '+money(grocery-month().budget.groceries)+'.');for(const id of ['furniture','equipment']){const g=goal(id);if(g&&goalProgress(g).remaining===0)list+=item('check','¡'+escapeHtml(g.name)+' completada!',id==='furniture'?'Puedes redirigir este aporte a Equipar nuestro hogar.':'Puedes redirigir este dinero a emergencia o a nuevas metas.',button('Revisar metas','view-goals','soft sm'));}return list||item('check','Vamos por buen camino','Sigue registrando los movimientos para mantener todo al día.');}
function compactTransactions(list){return list.length?list.map(t=>'<div class="detail-line"><span class="label"><span class="tile-icon '+(t.type==='income'?'blue':'green')+'" style="width:33px;height:33px">'+icon(t.type==='income'?'down':t.type==='expense'?'up':'arrows',16)+'</span><span>'+escapeHtml(t.description)+'<br><small class="muted">'+dateName(t.date)+' · '+escapeHtml(categoryName(t.category))+'</small></span></span><strong class="'+(t.type==='income'?'positive':'')+'">'+(t.type==='expense'?'−':'')+money(t.amount)+'</strong></div>').join(''):empty('Todo empieza con un primer movimiento','Registra una compra, un ingreso extra o un aporte.','new-transaction','Registrar movimiento');}
function budgetRow(key,label,note='',value=month().budget[key]){return '<div class="form-row"><label for="budget-'+key+'">'+escapeHtml(label)+(note?'<small>'+note+'</small>':'')+'</label><input id="budget-'+key+'" name="'+key+'" aria-label="'+escapeHtml(label)+'" type="number" min="0" step="0.01" max="1000000000" value="'+amountInput(value)+'" required></div>';}
function budgetSummary(t=totals()){return '<h2>Comparación con el plan</h2><p class="muted small" style="margin-top:6px">Referencia proyectada. El dinero real disponible se consulta en Inicio.</p><div class="divider"></div>'+detail('Ingresos',money(t.income))+detail('Hogar, IESS y moto',money(t.expenses))+detail('Ahorro y metas',money(t.savings))+detail('Dinero personal',money(t.personal))+(t.over?detail('Excesos registrados',money(t.over)):'')+'<div class="divider"></div><p class="muted small">Disponible</p><div class="money-big '+(t.available<0?'negative':'positive')+'">'+money(t.available)+'</div><div class="section-space">'+notice(t.available<0?'Debes reducir '+money(-t.available)+' para equilibrar el mes.':'Tienes '+money(t.available)+' sin asignar.',t.available<0?'error':'success')+'</div>';}
function renderBudget(){const m=month(),b=m.budget;return heading('Un plan para nuestro dinero.','Edita el presupuesto de este mes. Los meses cerrados conservan sus cifras.',button('Copiar mes anterior','copy-month','secondary','copy'))+closedNotice()+'<div class="form-layout section-space"><form id="budget-form" class="card"><div class="form-section"><div class="card-head"><h2>01 · Lo que recibimos</h2><span class="badge green">Ingresos</span></div>'+(m.incomeMode==='daily'?dailyBudgetIncome():budgetRow('income1',state.settings.names[0],'Sueldo mensual conservado',m.income[0])+budgetRow('income2',state.settings.names[1],'Sueldo mensual conservado',m.income[1])+budgetRow('extra','Ingresos extra planificados','Historial anterior al registro diario.',m.extra))+'</div><div class="form-section"><h2>02 · Hogar y obligaciones</h2>'+budgetRow('groceries','Supermercado y compras',money(b.groceries/2)+' por quincena · '+money(Math.round(b.groceries*12/52))+' por semana')+budgetRow('services','Servicios y hogar')+budgetRow('iess1','IESS · '+state.settings.names[0],'Aporte mensual editable, sin cálculo de tasas.')+budgetRow('iess2','IESS · '+state.settings.names[1],state.settings.sameIess?'Se igualará al primer aporte al guardar.':'Aporte independiente.')+budgetRow('gas','Gasolina de la moto',money(Math.round(b.gas*12/52))+' semanales, usando 52 semanas / 12 meses.')+budgetRow('maintenance','Reserva de mantenimiento','Se acumula en un fondo y no se pierde al terminar el mes.')+'</div><div class="form-section"><h2>03 · Nuestro futuro</h2>'+budgetRow('rent','Renta que no pagamos','Reservada; nunca se cuenta como dinero disponible para compras.')+budgetRow('emergency','Fondo de emergencia')+budgetRow('investment','Metas / inversión')+state.goals.map(g=>budgetRow('goal_'+g.id,g.name,'Objetivo: '+money(g.target),b.goals[g.id]||0)).join('')+'</div><div class="form-section"><h2>04 · Espacio para cada uno</h2>'+budgetRow('personal1',state.settings.names[0])+budgetRow('personal2',state.settings.names[1])+'<p class="field-note">El dinero personal pertenece a cada integrante y puede utilizarse libremente. No necesita justificarse ante el hogar.</p></div><div class="form-error" role="alert"></div><div class="actions section-space"><button class="btn" type="submit" '+(m.status==='closed'?'disabled':'')+'>'+icon('check',17)+' Guardar presupuesto</button>'+button('Restablecer mes','reset-month','secondary')+'</div></form><aside class="sticky"><section class="card" id="budget-summary">'+budgetSummary()+'</section><section class="card section-space"><h2>Presupuesto estable</h2><p class="muted small" style="margin:7px 0 15px">Para la etapa que empieza en febrero de 2027.</p>'+stableDonut()+'<div class="section-space">'+button(m.stable?'Reaplicar plan estable':'Activar plan estable','stable-plan','soft','leaf')+'</div><p class="field-note">La propuesta se adapta al ingreso de este mes. Revisa los importes antes de aplicarla.</p></section></aside></div>';}
function stableAmounts(){const total=totals().income;const household=Math.round(total*.4),emergency=Math.round(total*.2),rent=Math.round(total*.1),investment=Math.round(total*.1);return {household,emergency,rent,investment,personal:total-household-emergency-rent-investment};}
function stableDonut(){const a=stableAmounts();return donut([['Hogar · 40%',a.household],['Emergencia · 20%',a.emergency],['Renta · 10%',a.rent],['Metas · 10%',a.investment],['Personal · 20%',a.personal]],'Plan sugerido');}
function filteredTransactions(){const f=transactionFilters,k=f.month==='current'?state.selectedMonth:f.month;return state.transactions.filter(t=>(!k||t.date.startsWith(k))&&(!f.type||t.type===f.type)&&(!f.category||t.category===f.category)&&(!f.person||t.person===f.person)).slice().sort((a,b)=>b.date.localeCompare(a.date));}
function selectOptions(items,selected){return items.map(([value,label])=>'<option value="'+escapeHtml(value)+'" '+(value===selected?'selected':'')+'>'+escapeHtml(label)+'</option>').join('');}
function categoryOptions(){return [...Object.entries(categoryNames),...state.goals.map(g=>['goal:'+g.id,g.name])].map(([id])=>[id,categoryName(id)]);}
function transactionsTable(list,allowDelete=true){if(!list.length)return empty('Aún no hay movimientos','Los registros que coincidan con este mes y estos filtros aparecerán aquí.','new-transaction','Nuevo movimiento');return '<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th>Persona / cuenta</th><th>Tipo</th><th class="right">Monto</th>'+(allowDelete?'<th><span class="sr-only">Acciones</span></th>':'')+'</tr></thead><tbody>'+list.map(t=>'<tr><td class="nowrap">'+dateName(t.date)+'</td><td class="table-desc">'+escapeHtml(t.description)+'<span class="sub">'+escapeHtml(categoryName(t.category))+(t.subtype?' · '+t.subtype:'')+(t.type==='transfer'?' · desde '+escapeHtml(fundName(t.from)):'')+'</span></td><td>'+escapeHtml(personName(t.person))+'<span class="sub">'+escapeHtml(cashMode(t.date.slice(0,7))&&t.type==='expense'?cashLabel(cashExpenseFund(t)):accountName(t.account))+'</span></td><td><span class="badge '+(t.type==='income'?'green':t.type==='expense'?'':'yellow')+'">'+typeNames[t.type]+'</span>'+(t.source==='close'?'<span class="sub">Cierre automático</span>':'')+'</td><td class="right nowrap numeric">'+(t.type==='expense'?'−':'')+money(t.amount)+'</td>'+(allowDelete?'<td class="right">'+(t.source!=='close'&&month(t.date.slice(0,7)).status!=='closed'?'<button class="icon-btn" aria-label="Eliminar '+escapeHtml(t.description)+'" title="Eliminar movimiento" data-action="delete-transaction" data-id="'+escapeHtml(t.id)+'">'+icon('trash',16)+'</button>':icon('lock',15))+'</td>':'')+'</tr>').join('')+'</tbody></table></div>';}
function renderTransactions(){const tx=filteredTransactions(),f=transactionFilters;return heading('La historia de nuestro dinero.','Una sola lista para ingresos diarios, extras, gastos, aportes y transferencias.',button('Exportar CSV','export-csv','secondary','down')+button('Nuevo movimiento','new-transaction','','plus'))+'<section class="card"><div class="filters"><label>Mes<select data-filter="month">'+selectOptions([['current','Mes seleccionado'],['','Todos los meses'],...Object.keys(state.months).sort().map(k=>[k,monthName(k)])],f.month)+'</select></label><label>Categoría<select data-filter="category">'+selectOptions([['','Todas las categorías'],...categoryOptions()],f.category)+'</select></label><label>Persona<select data-filter="person">'+selectOptions([['','Todas'],['1',state.settings.names[0]],['2',state.settings.names[1]],['both','Ambos']],f.person)+'</select></label><label>Tipo<select data-filter="type">'+selectOptions([['','Todos'],...Object.entries(typeNames)],f.type)+'</select></label></div>'+transactionsTable(tx)+'<div class="card-footer"><span>'+tx.length+' movimientos</span><span>Ingresos '+money(sum(tx.filter(t=>t.type==='income').map(t=>t.amount)))+' · Gastos '+money(sum(tx.filter(t=>t.type==='expense').map(t=>t.amount)))+'</span></div></section><div class="section-space">'+notice('Los ingresos diarios de NEOMAR aparecen aquí una sola vez. Edítalos desde Ingresos NEOMAR. Registra otros ingresos como bonos o extraordinarios; las transferencias no crean ingresos.')+'</div>';}
function renderGoals(){return heading('Hagamos espacio para los sueños.','Cada aporte nos acerca a la vida que queremos construir.',button('Nueva meta','new-goal','','plus'))+'<div class="grid cols2">'+state.goals.map(g=>{const p=requiredContribution(g);return '<article class="card goal-card"><div class="card-head"><span class="tile-icon '+(g.id==='furniture'?'':'green')+'">'+icon(g.id==='furniture'?'sofa':'target',24)+'</span><span class="badge '+(p.remaining===0?'green':'yellow')+'">'+(p.remaining===0?'Meta completada':p.months?monthName(g.due.slice(0,7)):'Plazo vencido')+'</span></div><h2>'+escapeHtml(g.name)+'</h2><div class="savings-number">'+money(p.achieved)+' <span class="muted" style="font-size:1rem;font-weight:400">/ '+money(g.target)+'</span></div>'+progress(p.pct,g.id==='furniture'?'orange':'')+'<div class="progress-label"><span>'+percent(p.pct)+' completado</span><span>Faltan '+money(p.remaining)+'</span></div><dl class="goal-detail"><div><dt>Saldo disponible en el fondo</dt><dd>'+money(p.balance)+'</dd></div><div><dt>Compras pagadas con el fondo</dt><dd>'+money(p.spent)+'</dd></div><div><dt>Meses para aportar</dt><dd>'+p.months+' · hasta '+dateName(g.due)+'</dd></div><div><dt>Aporte mensual necesario</dt><dd>'+(p.required===null?'Plazo vencido':money(p.required))+'</dd></div><div><dt>Plan de referencia este mes</dt><dd>'+money(month().budget.goals[g.id]||0)+'</dd></div><div><dt>Aporte mensual habitual</dt><dd>'+money(g.monthly)+'</dd></div></dl><div class="actions">'+button(cashMode()?'Mover dinero a esta meta':'Agregar aporte','contribute','soft','plus','data-fund="goal:'+g.id+'"')+button('Editar','edit-goal','secondary sm','edit','data-id="'+g.id+'"')+button('Eliminar','delete-goal','secondary sm','trash','data-id="'+g.id+'"')+'</div>'+(g.id==='furniture'&&p.remaining===0?'<div class="section-space">'+button('Redirigir aporte a equipar el hogar','redirect-goal','soft sm')+'</div>':'')+'</article>';}).join('')+'</div>'+(state.goals.length===0?'<section class="card">'+empty('Una nueva meta empieza aquí','Define un monto, una fecha y un aporte mensual.','new-goal','Crear meta')+'</section>':'')+'<section class="card section-space"><div class="card-head"><div><h2>Equipar nuestro hogar</h2><p>Diciembre 2026 y enero 2027 · distribución sugerida, editable</p></div></div><form id="equipment-form"><div class="table-scroll"><table class="equipment-table"><thead><tr><th>Lo que queremos para casa</th><th>Diciembre</th><th>Enero</th></tr></thead><tbody>'+state.equipment.map(e=>'<tr><td>'+escapeHtml(e.name)+'</td><td><input aria-label="'+escapeHtml(e.name)+' diciembre" type="number" step="0.01" min="0" max="1000000000" name="dec_'+e.id+'" value="'+amountInput(e.dec)+'" required></td><td><input aria-label="'+escapeHtml(e.name)+' enero" type="number" step="0.01" min="0" max="1000000000" name="jan_'+e.id+'" value="'+amountInput(e.jan)+'" required></td></tr>').join('')+'</tbody><tfoot><tr><td><strong>Total sugerido</strong></td><td id="equipment-dec">'+money(sum(state.equipment.map(e=>e.dec)))+'</td><td id="equipment-jan">'+money(sum(state.equipment.map(e=>e.jan)))+'</td></tr></tfoot></table></div><p class="field-note">Esta lista distribuye las compras deseadas. El aporte al fondo se cambia en Presupuesto; las compras reales se registran como gastos desde el fondo de la meta.</p><div class="form-error" role="alert"></div><div class="actions section-space"><button class="btn" type="submit">Guardar distribución</button>'+button('Registrar compra con un fondo','fund-expense','secondary','cart')+'</div></form></section>';}
function groceryStatus(spent,budget){const pct=budget?spent/budget*100:spent?101:0;if(pct>100)return {pct,type:'error',text:'Este mes las compras superaron el presupuesto en '+money(spent-budget)+'.'};if(pct===100)return {pct,type:'error',text:'Has utilizado el 100% del presupuesto de compras.'};if(pct>=90)return {pct,type:'warning',text:'Ya utilizaste al menos el 90%. Quedan '+money(budget-spent)+'.'};if(pct>=75)return {pct,type:'warning',text:'Ya utilizaste al menos el 75%. Planifica las compras que faltan.'};return {pct,type:'success',text:'Todavía tienes '+money(budget-spent)+' para las compras del mes.'};}
function renderHouse(){if(cashMode())return cashGroupPage('home');const m=month(),spent=spending(state.selectedMonth,'groceries'),status=groceryStatus(spent,m.budget.groceries),list=transactions().filter(t=>t.type==='expense'&&!t.from&&t.category==='groceries');return heading('Lo que hace de esta casa un hogar.','Compras claras, sin perder de vista el presupuesto.',button('Registrar compra','new-purchase','','plus'))+'<section class="stats">'+stat('Presupuesto mensual',m.budget.groceries,'Para supermercado, limpieza y hogar','cart')+stat('Gastado este mes',spent,list.length+' compras registradas','up')+stat('Queda para compras',m.budget.groceries-spent,'Dentro de la reserva mensual','wallet',true,spent>m.budget.groceries)+stat('Por quincena',Math.round(m.budget.groceries/2),money(Math.round(m.budget.groceries*12/52))+' por semana aproximadamente','calendar')+'</section><section class="card"><div class="card-head"><h2>Vamos a nuestro ritmo</h2><strong>'+percent(status.pct)+' utilizado</strong></div>'+progress(status.pct,spent>m.budget.groceries?'red':status.pct>=75?'orange':'')+'<div class="section-space">'+notice(status.text,status.type,status.type==='success'?'check':'alert')+'</div></section><div class="grid cols2 section-space"><section class="card"><div class="card-head"><h2>Obligaciones del hogar</h2><button class="link-btn" data-page="budget">Editar '+icon('edit',14)+'</button></div>'+detail('Servicios y hogar',money(m.budget.services))+detail('IESS · '+escapeHtml(state.settings.names[0]),money(m.budget.iess1))+detail('IESS · '+escapeHtml(state.settings.names[1]),money(m.budget.iess2))+detail('Total IESS',money(m.budget.iess1+m.budget.iess2))+'</section><section class="card"><h2>Gastos reales por categoría</h2>'+spendingBars()+'</section></div><section class="card section-space"><div class="card-head"><h2>Nuestras compras</h2><span class="badge">'+list.length+' registros</span></div>'+transactionsTable(list.slice().reverse())+'</section><div class="section-space">'+notice('Las compras con dinero conjunto superiores a '+money(state.settings.limit)+' deberían conversarse antes.','','heart')+'</div>';}
function spendingBars(){const categories=['groceries','services','gas','iess1','iess2','other'];const entries=categories.map(c=>[categoryName(c),spending(state.selectedMonth,c)]);const max=Math.max(1,...entries.map(e=>e[1]));return entries.map(([label,value])=>'<div class="chart-bar"><span>'+escapeHtml(label)+'</span>'+progress(value/max*100,'blue')+'<strong>'+money(value)+'</strong></div>').join('');}
function renderBike(){if(cashMode())return cashGroupPage('motorcycle');const m=month(),balance=balances().maintenance,gasSpent=spending(state.selectedMonth,'gas');const list=state.transactions.filter(t=>(t.category==='maintenance'||t.category==='gas')&&t.date.startsWith(state.selectedMonth));return heading('Dos ruedas, todo en orden.','La gasolina del mes y un fondo que nos acompaña en el camino.',button('Registrar mantenimiento','maintenance-expense','','plus'))+'<div class="grid cols2"><section class="card"><div class="goal-row"><span class="tile-icon blue">'+icon('bike',24)+'</span><h2>Gasolina</h2></div><div class="savings-number">'+money(m.budget.gas)+' <span class="small muted">/ mes</span></div><p class="muted small">Equivale a '+money(Math.round(m.budget.gas*12/52))+' por semana.</p><div class="divider"></div>'+detail('Gastado este mes',money(gasSpent))+detail('Disponible para gasolina',money(m.budget.gas-gasSpent))+'<form id="gas-form" class="section-space"><div class="field-grid">'+moneyInput('weekly','Presupuesto semanal',Math.round(m.budget.gas*12/52))+'<div style="align-self:end"><button class="btn secondary" type="submit">Actualizar</button></div></div><p class="field-note">Equivalente mensual = semanal × 52 ÷ 12. $15 por semana son $65 al mes.</p><div class="form-error" role="alert"></div></form><div class="section-space">'+button('Registrar gasolina','gas-expense','soft','plus')+'</div></section><section class="card soft-card"><div class="goal-row"><span class="tile-icon green">'+icon('settings',24)+'</span><h2>Mantenimiento</h2></div><p class="muted small section-space">Saldo acumulado disponible</p><div class="money-big">'+money(balance)+'</div><div class="divider"></div>'+detail('Reserva mensual',money(m.budget.maintenance))+detail('Aportado este mes',money(savingsContributed(state.selectedMonth,'maintenance')))+detail('Mantenimiento pagado desde el hogar',money(spending(state.selectedMonth,'maintenance')))+'<p class="small muted" style="margin-to function renderSavings(){if(cashMode())return renderCashSavings();const b=balances(),m=month(),t=totals(),levels=[['Nivel 1 · Primer respaldo',100000],['Nivel 2 · Más tranquilidad',250000],['Nivel 3 · 3 meses esenciales',t.essential*3],['Nivel 4 · 6 meses esenciales',t.essential*6]];return heading('Hoy ahorramos. Mañana elegimos.','Nuestros fondos tienen un propósito y se mantienen separados.',button('Transferir entre fondos','transfer','secondary','arrows')+button('Agregar ahorro','new-saving','','plus'))+'<div class="grid cols2"><section class="card"><div class="goal-row"><span class="tile-icon green">'+icon('home',23)+'</span><h2>Renta que no pagamos</h2></div><p class="muted small section-space">Ahorro acumulado real</p><div class="money-big">'+money(b.rent)+'</div>'+detail('Reservado este mes',money(m.budget.rent))+detail('Aporte registrado este mes',money(savingsContributed(state.selectedMonth,'rent')))+'<div class="forecast">'+[6,12,24].map(n=>'<div><small>En '+n+' meses</small><strong>'+money(b.rent+m.budget.rent*n)+'</strong></div>').join('')+'</div><p class="field-note">Saldo actual + aportes futuros, sin intereses ni retiros.</p><p class="quote">“No pagar renta es una oportunidad para construir patrimonio, no para aumentar los gastos.”</p><div class="actions section-space">'+button('Aportar a renta','contribute','soft','plus','data-fund="rent"')+'<button class="btn secondary" data-page="budget">Editar aporte mensual</button></div></section><section class="card"><div class="goal-row"><span class="tile-icon blue">'+icon('shield',23)+'</span><h2>Fondo de emergencia</h2></div><div class="savings-number">'+money(b.emergency)+'</div><p class="muted small">Gastos esenciales del mes: '+money(t.essential)+'</p>'+levels.map(([name,target])=>'<div class="section-space"><div class="progress-label"><span>'+name+'</span><strong>'+money(target)+'</strong></div>'+progress(target?b.emergency/target*100:100,'blue')+'</div>').join('')+'<p class="field-note">Los niveles 3 y function savingsChart(){const keys=Object.keys(state.months).sort();const data=keys.map(k=>{const b=balances(state,k);return sum(Object.entries(b).filter(([f])=>f!=='maintenance').map(([,v])=>v));});const max=Math.max(100,...data);const width=580,height=205,x=i=>45+(keys.length===1?245:i*500/(keys.length-1)),y=v=>160-v/max*125;const points=data.map((v,i)=>x(i)+','+y(v)).join(' ');const tickStep=Math.max(1,Math.ceil(keys.length/6));return '<svg class="line-chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Evolución del ahorro: '+escapeHtml(keys.map((k,i)=>monthName(k)+' '+money(data[i])).join('; '))+'">'+[0,.5,1].map(n=>'<line x1="45" y1="'+y(max*n)+'" x2="555" y2="'+y(max*n)+'" stroke="var(--line)"/><text x="2" y="'+(y(max*n)-6)+'">'+Math.round(max*n/100)+'</text>').join('')+'<polygon points="45,160 '+points+' '+x(data.length-1)+',160" fill="var(--green-soft)"/><polyline points="'+points+'" fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round"/>'+data.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="var(--green)"><title>'+monthName(keys[i])+': '+money(v)+'</title></circle>'+(i%tickStep===0?'<text x="'+x(i)+'" y="187" text-anchor="middle">'+new Intl.DateTimeFormat('es-EC',{month:'short',year:'2-digit'}).format(new Date(keys[i]+'-01T12:00:00'))+'</text>':'')).join('')+'</svg>';}
function resetSimulation(){simulator={income:totals().income,groceries:month().budget.groceries,rent:month().budget.rent,tv:state.equipment.find(e=>e.id==='tv')?.dec||0};}
function simulationResults(){const t=totals(),m=month(),reference=state.equipment.find(e=>e.id==='tv')?.dec||0;const changed=clone(m);changed.incomeMode='fixed';changed.income=[simulator.income,0];changed.extra=0;changed.budget.groceries=simulator.groceries;changed.budget.rent=simulator.rent;const simulated=totals(state.selectedMonth,state,changed);simulated.income=simulator.income;simulated.available-=t.extraRecorded;const tvDifference=simulator.tv-reference;simulated.available-=tvDifference;return {t,simulated,tvDifference,delta:simulated.available-t.available};}

/* NEOMAR: a single net household-income record per date, in integer cents.
 * Estimates never enter income totals. A recorded zero is a completed day;
 * an absent record is unknown. Tuesdays, Fridays, Saturdays and Sundays.
 */
const NEOMAR_DAYS=[0,2,5,6];
function isNeomar(t){return t.type==='income'&&t.category==='neomar';}
function workDates(k){const dates=[];for(let day=1;day<=Number(lastDate(k).slice(-2));day++){const date=k+'-'+String(day).padStart(2,'0');if(NEOMAR_DAYS.includes(new Date(date+'T12:00:00').getDay()))dates.push(date);}return dates;}
function dailyRecords(k=state.selectedMonth,s=state){return transactions(k,s).filter(isNeomar).slice().sort((a,b)=>a.date.localeCompare(b.date));}
function dailySummary(k=state.selectedMonth,s=state){
 const rows=dailyRecords(k,s),scheduled=workDates(k),recorded=new Set(rows.map(r=>r.date));
 const total=sum(rows.map(r=>r.amount)),missing=scheduled.filter(d=>!recorded.has(d));
 const average=rows.length?Math.round(total/rows.length):null;
 const t=totals(k,s),uncovered=Math.max(0,t.planned+t.over-t.income);
 return {rows,scheduled,missing,total,count:rows.length,average,projection:average===null?null:total+Math.round(total/rows.length*missing.length),uncovered,needed:missing.length?Math.ceil(uncovered/missing.length):null,dailyTarget:Math.ceil(t.planned/scheduled.length),otherIncome:sum(transactions(k,s).filter(t=>t.type==='income'&&!isNeomar(t)).map(t=>t.amount))};
}

 return migrateCashState(value);

/* Real income allocation: IESS remains fixed; all other shares are percentages.
 * Store basis points (10000 = 100%) and use largest remainders in integer cents.
 * This is an allocation view, never a deposit, transfer or balance mutation.
 */
const actualKeys=['home','motorcycle','saving','goals','personal1','personal2','unassigned'];
const actualPalette={home:'#568066',iess:'#769cba',motorcycle:'#b4c6bd',saving:'#8ca775',goals:'#d5aa69',personal1:'#a5a0ba',personal2:'#bd8ea9',unassigned:'#87949c'};
function actualLabels(s=state){return {home:'Hogar',iess:'IESS',motorcycle:'Moto',saving:'Ahorro',goals:'Metas',personal1:s.settings.names[0],personal2:s.settings.names[1],unassigned:'Sin asignar'};}
function splitIntegers(total,entries){
 assert(Number.isSafeInteger(total)&&total>=0,'Importe de reparto inválido.');
 assert(entries.every(([,weight])=>Number.isSafeInteger(weight)&&weight>=0),'Proporciones inválidas.');
 const weightTotal=entries.reduce((n,[,weight])=>n+BigInt(weight),0n);
 if(weightTotal===0n)return Object.fromEntries(entries.map(([key])=>[key,0]));
 const parts=entries.map(([key,weight],order)=>{const product=BigInt(total)*BigInt(weight);return {key,order,value:Number(product/weightTotal),remainder:product%weightTotal};});
 let remaining=total-sum(parts.map(p=>p.value));
 const sorted=parts.slice().sort((a,b)=>a.remainder===b.remainder?a.order-b.order:a.remainder>b.remainder?-1:1);
 for(let i=0;i<remaining;i++)sorted[i].value++;
 return Object.fromEntries(parts.map(p=>[p.key,p.value]));
}
function percentagesFromPlan(m=month()){
 const b=m.budget,weights={home:b.groceries+b.services,motorcycle:b.gas+b.maintenance,saving:b.rent+b.emergency+b.investment,goals:sum(Object.values(b.goals)),personal1:b.personal1,personal2:b.personal2,unassigned:0};
 if(sum(Object.values(weights))===0)weights.unassigned=1;
 return splitIntegers(10000,actualKeys.map(key=>[key,weights[key]]));
}
function actualPercentages(m=month()){return m.actualPercentages?clone(m.actualPercentages):percentagesFromPlan(m);}
function validActualPercentages(p){return p&&typeof p==='object'&&!Array.isArray(p)&&Object.keys(p).length===actualKeys.length&&actualKeys.every(key=>Object.hasOwn(p,key)&&Number.isInteger(p[key])&&p[key]>=0&&p[key]<=10000)&&sum(Object.values(p))===10000;}
function actualPercent(bp){return new Intl.NumberFormat('es-EC',{maximumFractionDigits:2}).format(bp/100)+'%';}
function usedIncomeByGroup(k=state.selectedMonth,s=state){
 const used=Object.fromEntries(['iess',...actualKeys].map(key=>[key,0]));
 for(const tx of transactions(k,s)){
  if(tx.type==='saving'){
   if(tx.to==='maintenance')used.motorcycle+=tx.amount;
   else if(tx.to?.startsWith('goal:'))used.goals+=tx.amount;
   else used.saving+=tx.amount;
  }
  if(tx.type!=='expense'||tx.from)continue; // Fund withdrawals have already been funded.
  if(['iess1','iess2'].includes(tx.category))used.iess+=tx.amount;
  else if(['gas','maintenance'].includes(tx.category))used.motorcycle+=tx.amount;
  else if(['personal1','personal2'].includes(tx.category))used[tx.category]+=tx.amount;
  else used.home+=tx.amount;
 }
 return used;
}
function realAllocation(k=state.selectedMonth,s=state){
 const m=month(k,s),b=m.budget,received=sum(transactions(k,s).filter(t=>t.type==='income').map(t=>t.amount));
 const iessTarget=b.iess1+b.iess2,iess=Math.min(received,iessTarget),remainder=received-iess;
 const percentages=actualPercentages(m),allocated=splitIntegers(remainder,actualKeys.map(key=>[key,percentages[key]]));
 allocated.iess=iess;
 const iessParts=splitIntegers(iess,[['iess1',b.iess1],['iess2',b.iess2]]),used=usedIncomeByGroup(k,s);
 const remaining=Object.fromEntries(Object.keys(allocated).map(key=>[key,allocated[key]-used[key]]));
 return {received,iessTarget,iess,remainder,iessMissing:iessTarget-iess,iessParts,percentages,allocated,used,remaining,usedTotal:sum(Object.values(used)),remainingTotal:received-sum(Object.values(used))};
}
function actualChart(a){
 const labels=actualLabels(),order=['iess','personal1','personal2','home','motorcycle','saving','goals','unassigned'];
 const keys=order.filter(key=>key!=='unassigned'||a.percentages.unassigned>0||a.allocated.unassigned>0);
 let running=0;
 const stops=keys.map(key=>{const start=running;running+=a.received?a.allocated[key]/a.received*100:0;return actualPalette[key]+' '+start+'% '+running+'%';}).join(',');

/* Cash ledger. Recorded income is credited exactly once; allocations are derived,
 * not duplicate transactions. Legacy savings in the new period are earmarks.
 * Dates are processed as daily batches: receipts first, then payments.
 */
const cashExtraFunds=['cash:home','cash:iess','cash:personal1','cash:personal2','cash:saving','cash:goals','cash:unassigned'];
const cashGroupOrder=['iess','personal1','personal2','home','motorcycle','saving','goals','unassigned'];
function cashReadyMonth(m){m.actualPercentages=actualPercentages(m);return m;}
function cashMode(k=state.selectedMonth,s=state){return s.version>=3&&validMonth(s.cashStartMonth)&&k>=s.cashStartMonth;}
function cashGroup(f){if(f==='maintenance')return 'motorcycle';if(['rent','emergency','investment'].includes(f))return 'saving';if(f?.startsWith('goal:'))return 'goals';return f?.startsWith('cash:')?f.slice(5):'home';}
function cashFundForCategory(c){if(['gas','maintenance'].includes(c))return 'maintenance';if(['iess1','iess2'].includes(c))return 'cash:iess';if(['personal1','personal2'].includes(c))return 'cash:'+c;if(['groceries','services','other'].includes(c))return 'cash:home';return c;}
function cashExpenseFund(t){return t.from||cashFundForCategory(t.category);}
function cashGroups(b){const out=Object.fromEntries(cashGroupOrder.map(k=>[k,0]));for(const[f,v]of Object.entries(b))out[cashGroup(f)]+=v;return out;}
function cashLabel(f,s=state){const labels=actualLabels(s);if(f==='maintenance')return 'Moto';if(f==='cash:goals')return 'Metas · por repartir';if(f==='cash:saving')return 'Ahorro · por repartir';if(f?.startsWith('cash:'))return labels[cashGroup(f)]||f;return f?.startsWith('goal:')?(goal(f.slice(5),s)?.name||'Meta'):categoryNames[f]||f;}
// Sainte-Lague highest averages: exact cents and house monotonicity. Starting
// near proportional quotas keeps this bounded by rounding corrections, not money.
function splitCash(total,entries){
 const near=splitIntegers(total,entries),parts=entries.map(([key,weight],order)=>({key,weight:BigInt(weight),order,value:near[key]}));
 const compare=(a,ad,b,bd)=>{const d=a.weight*BigInt(bd)-b.weight*BigInt(ad);return d>0n?1:d<0n?-1:b.order-a.order;};
 while(total>0){let next=null,last=null;for(const p of parts){if(p.weight>0n&&(!next||compare(p,2n*BigInt(p.value)+1n,next,2n*BigInt(next.value)+1n)>0))next=p;if(p.value>0&&(!last||compare(p,2n*BigInt(p.value)-1n,last,2n*BigInt(last.value)-1n)<0))last=p;}
  if(!next||!last||compare(next,2n*BigInt(next.value)+1n,last,2n*BigInt(last.value)-1n)<=0)break;next.value++;last.value--;
 }
 return Object.fromEntries(parts.map(p=>[p.key,p.value]));
}
function cashFunding(k,received,s=state,earmarks={}){
 const m=month(k,s),b=m.budget,iess=Math.min(received,b.iess1+b.iess2),p=actualPercentages(m);
 const grouped=splitCash(received-iess,actualKeys.map(key=>[key,p[key]]));grouped.iess=iess;
 const funds=Object.fromEntries(allFunds(s).map(f=>[f,0]));
 for(const key of ['home','iess','personal1','personal2','unassigned'])funds['cash:'+key]=grouped[key];funds.maintenance=grouped.motorcycle;
 for(const group of ['saving','goals']){
  const members=group==='saving'?['rent','emergency','investment']:s.goals.map(g=>'goal:'+g.id);
  const wanted=members.map(f=>[f,earmarks[f]||0]),reserved=sum(wanted.map(([,v])=>v)),amount=grouped[group];
  // Old contributions earmark the existing allocation; they never add income.
  const fixed=reserved>amount?splitCash(amount,wanted):Object.fromEntries(wanted);
  for(const[f,v]of Object.entries(fixed))funds[f]=v;
  const rest=amount-Math.min(amount,reserved),weights=members.map(f=>[f,group==='saving'?b[f]:(b.goals[f.slice(5)]||0)]);
  if(sum(weights.map(([,v])=>v)))for(const[f,v]of Object.entries(splitCash(rest,weights)))funds[f]+=v;
  else funds['cash:'+group]+=rest;
 }
 return {grouped,funds,iessMissing:b.iess1+b.iess2-iess,received,percentages:p};
}
function cashBook(s=state,throughDate=null,checkpoints=false){
 const b=Object.fromEntries(allFunds(s).map(f=>[f,openingFund(f,s)])),monthly={},points=[];
 const dates=new Map();for(const t of s.transactions){if(throughDate&&t.date>throughDate)continue;if(!dates.has(t.date))dates.set(t.date,[]);dates.get(t.date).push(t);}
 for(const[date,rows]of [...dates].sort(([a],[b])=>a.localeCompare(b))){
  const k=date.slice(0,7);
  if(!cashMode(k,s)){
   for(const t of rows){if(t.type==='saving')b[t.to]+=t.amount;else if(t.type==='transfer'){b[t.from]-=t.amount;b[t.to]+=t.amount;}else if(t.type==='expense'&&t.from)b[t.from]-=t.amount;}
  }else{
   const entry=monthly[k]||(monthly[k]={received:0,earmarks:{},funded:Object.fromEntries(allFunds(s).map(f=>[f,0]))});
   for(const t of rows){if(t.type==='income')entry.received+=t.amount;if(t.type==='saving')entry.earmarks[t.to]=(entry.earmarks[t.to]||0)+t.amount;}
   const target=cashFunding(k,entry.received,s,entry.earmarks).funds;
   for(const f of allFunds(s))b[f]+=target[f]-entry.funded[f];entry.funded=target;
   for(const t of rows){if(t.type==='expense')b[cashExpenseFund(t)]-=t.amount;else if(t.type==='transfer'){b[t.from]-=t.amount;b[t.to]+=t.amount;}}
  }
  if(checkpoints)points.push({date,balances:{...b}});
 }
 return {balances:b,groups:cashGroups(b),total:sum(Object.values(b)),monthly,points};
}
function cashSummary(k=state.selectedMonth,s=state){
 const now=cashBook(s,lastDate(k)),before=cashBook(s,lastDate(shiftMonth(k,-1))),rows=transactions(k,s),received=sum(rows.filter(t=>t.type==='income').map(t=>t.amount));
 const earmarks={};for(const t of rows)if(t.type==='saving')earmarks[t.to]=(earmarks[t.to]||0)+t.amount;
 const funding=cashFunding(k,received,s,earmarks),spent=Object.fromEntries(cashGroupOrder.map(g=>[g,0])),moved={...spent};
 for(const t of rows){if(t.type==='expense')spent[cashGroup(cashExpenseFund(t))]+=t.amount;if(t.type==='transfer'){moved[cashGroup(t.from)]-=t.amount;moved[cashGroup(t.to)]+=t.amount;}}
 return {...now,funding,received,spent,moved,opening:before.groups,openingTotal:before.total,spentTotal:sum(Object.values(spent))};
}
function validateCashChange(before,after){
 if(after.version<3)return;
 const a=cashBook(before,null,true),b=cashBook(after,null,true),dates=[...new Set([...a.points,...b.points].map(p=>p.date))].filter(d=>d.slice(0,7)>=after.cashStartMonth).sort();
 let ai=0,bi=0,av=Object.fromEntries(allFunds(before).map(f=>[f,openingFund(f,before)])),bv=Object.fromEntries(allFunds(after).map(f=>[f,openingFund(f,after)]));
 for(const date of dates){while(ai<a.points.length&&a.points[ai].date<=date)av=a.points[ai++].balances;while(bi<b.points.length&&b.points[bi].date<=date)bv=b.points[bi++].balances;
  for(const f of allFunds(after)){const previous=av[f]||0,next=bv[f]||0;assert(next>=Math.min(0,previous),'La caja '+cashLabel(f,after)+' no alcanza al '+dateName(date)+'. Faltan '+money(-next)+'. Mueve dinero desde otra caja o revisa la fecha, el ingreso y los porcentajes.');}
 }
}
function cashValidExpense(t,s){return cashMode(t.date.slice(0,7),s)&&allFunds(s).includes(t.from)&&t.account==='savings'&&(t.category===t.from||cashFundForCategory(t.category)===t.from);}
function migrateCashState(value){
 const s=clone(value);validateState(s);if(s.version>=3)return s;
 const lastClosed=Object.keys(s.months).filter(k=>s.months[k].status==='closed').sort().at(-1);
 if(s.version===1)for(const[k,m]of Object.entries(s.months))m.incomeMode=(m.status==='closed'||(lastClosed&&k<lastClosed))?'fixed':'daily';
 s.cashStartMonth=lastClosed?shiftMonth(lastClosed,1):Object.keys(s.months).sort()[0];s.version=3;
 for(const[k,m]of Object.entries(s.months))if(cashMode(k,s))m.actualPercentages=actualPercentages(m);
 validateState(s);return s;
}

/* Shared household persistence. One durable operation at a time, compare-and-swap
 * on the server, no last-write-wins. Local financial data is never auto-uploaded. */
const cloud = {
 enabled: Boolean(window.FINANZAS_CLOUD?.url || window.FINANZAS_CLOUD?.publishableKey),
 client:null,user:null,household:null,members:[],pending:null,busy:false,reading:false,
 gated:true,phase:'loading',error:'',dirty:false,epoch:0,writer:false,release:null,
 notice:'',key:'',prefsKey:'',project:'',local:null,deferred:null,
 wire(value){const s=clone(value);s.selectedMonth=Object.keys(s.months).sort()[0];s.settings.theme='light';s.updatedAt=null;return s;},
 same(a,b){return JSON.stringify(this.wire(a))===JSON.stringify(this.wire(b));},
 prefs(){try{localStorage.setItem(this.prefsKey,JSON.stringify({month:state.selectedMonth,theme:state.settings.theme}));}catch{}},
 restore(value){const next=migrateState(clone(value));let pref;try{pref=JSON.parse(localStorage.getItem(this.prefsKey)||'null');}catch{}
  if(pref?.theme==='dark'||pref?.theme==='light')next.settings.theme=pref.theme;
  if(next.months[pref?.month])next.selectedMonth=pref.month;return next;},
 record(before,after){
  if(this.same(before,after)){this.prefs();return false;}
  assert(!this.gated&&this.household,'Inicia sesión y abre tu hogar antes de guardar.');
  assert(this.writer,'Esta app está abierta en otra pestaña. Cierra esa pestaña y vuelve a cargar esta para editar.');
  assert(!this.pending,'Hay un cambio pendiente. Sincronízalo o revísalo antes de registrar otro.');
  assert(!this.deferred,'Llegaron datos actualizados. Cierra el formulario y espera unos segundos antes de volver a editar.');
  validateState(after);
  const pending={household:this.household.id,revision:this.household.revision,mutation:crypto.randomUUID(),state:this.wire(after),createdAt:new Date().toISOString()};
  try{localStorage.setItem(this.key,JSON.stringify(pending));}catch{throw Error('No se pudo conservar el cambio en este dispositivo. Libera espacio antes de guardar.');}
  this.pending=pending;this.prefs();this.notice='Cambio guardado en este dispositivo; pendiente de sincronizar.';
  setTimeout(()=>this.flush(),0);return true;
 },
 async rpc(name,args={}){let request=this.client.rpc(name,args);if(globalThis.AbortSignal?.timeout)request=request.abortSignal(AbortSignal.timeout(15000));const {data,error}=await request;if(error){const message=error.message||'';throw Error(/fetch|network|abort|timeout/i.test(message)?'No se pudo conectar. Revisa internet y vuelve a intentar.':message||'No se pudo conectar con el hogar.');}return data;},
 status(){if(!this.enabled)return 'Solo en este dispositivo · nube sin configurar';if(this.gated)return 'Acceso al hogar';if(this.pending?.conflict)return 'Hay cambios que revisar';if(this.pending)return this.busy?'Guardando en el hogar…':'Cambio pendiente de sincronizar';if(!this.writer)return 'Otra pestaña tiene la edición abierta';return this.notice||'Hogar compartido · sincronizado';},
 banner(){return '<div class="cloud-status '+(this.pending?'cloud-warning':'')+'"><span role="status">'+escapeHtml(this.status())+'</span><button class="btn secondary sm" data-cloud="account">'+(this.enabled?'Mi hogar':'Conectar dispositivos')+'</button></div>';},
 paint(){const el=$('#cloud-status');if(el)el.innerHTML=this.banner();},
 async flush(){
  if(!this.pending||this.pending.conflict||this.busy||!this.writer||this.gated)return;
  const op=this.pending,epoch=this.epoch;this.busy=true;this.paint();
  try{
   const data=await this.rpc('finance_save',{p_household:op.household,p_expected_revision:op.revision,p_state:op.state,p_mutation:op.mutation});
   if(epoch!==this.epoch)return;
   assert(data?.household&&['saved','replayed','conflict'].includes(data.status),'La respuesta del servidor no es válida.');
   validateState(data.household.state);
   if(data.status==='conflict'){
    op.conflict=true;localStorage.setItem(this.key,JSON.stringify(op));this.notice='Tu cambio está conservado. Revisa los datos compartidos antes de continuar.';
    toast('Tu pareja guardó un cambio antes. Conservamos el tuyo para revisarlo.',true);
   }else{
    localStorage.removeItem(this.key);this.pending=null;this.notice='Hogar compartido · sincronizado';
    // A save completes after the submitting dialog closes; never interrupt a new form.
    if(!this.editing()){this.household=data.household;state=this.restore(data.household.state);state.updatedAt=data.household.updated_at;render();}else{this.deferred=data.household;this.notice='Guardado. Cierra el formulario para cargar los datos actualizados.';}
    toast('Cambio guardado en el hogar compartido.');
   }
  }catch(e){if(epoch===this.epoch){if(this.notice!==e.message)toast('El cambio sigue pendiente: '+e.message,true);this.notice=e.message;}}
  finally{if(epoch===this.epoch){this.busy=false;this.paint();}}
 },
 editing(){return Boolean($('#dialog')?.open||this.dirty||document.activeElement?.closest('#main form'));},
 async poll(){
  if(!this.enabled||!this.user||this.gated||document.hidden||this.reading||this.busy)return;
  if(this.pending){if(!this.pending.conflict)await this.flush();return;}
  if(this.editing())return;
  if(this.deferred){this.household=this.deferred;state=this.restore(this.deferred.state);state.updatedAt=this.deferred.updated_at;this.deferred=null;render();}
  const epoch=this.epoch;this.reading=true;
  try{const data=await this.rpc('finance_bootstrap');if(epoch!==this.epoch||this.pending||this.editing())return;
   assert(data.household?.id===this.household?.id,'No se pudo verificar el acceso al hogar. Vuelve a iniciar sesión.');
   this.members=data.members||[];
   if(data.household.revision!==this.household.revision){validateState(data.household.state);this.household=data.household;this.members=data.members||[];state=this.restore(data.household.state);state.updatedAt=data.household.updated_at;render();}
   this.notice='Hogar compartido · sincronizado';this.paint();
  }catch(e){if(epoch===this.epoch){this.notice='Sin conexión confirmada · '+e.message;this.paint();}}
  finally{if(epoch===this.epoch)this.reading=false;}
 },
 async lock(epoch){
  this.writer=false;
  if(!navigator.locks){this.notice='Usa un navegador actualizado con HTTPS para editar el hogar.';return;}
  await new Promise(resolve=>{navigator.locks.request('finanzas-writer:'+this.key,{ifAvailable:true},async lock=>{
   if(epoch!==this.epoch||!lock){resolve();return;}
   this.writer=true;await new Promise(release=>{this.release=release;resolve();});
  }).catch(()=>resolve());});
 },
 async attach(data){
  assert(data.household?.state,'No se recibió el hogar.');validateState(data.household.state);
  const epoch=this.epoch;this.household=data.household;this.members=data.members||[];
  this.key='finanzas-pending:'+this.project+':'+this.user.id+':'+data.household.id;
  this.prefsKey='finanzas-prefs:'+this.project+':'+this.user.id;
  this.release?.();this.release=null;await this.lock(epoch);if(epoch!==this.epoch)return;
  const raw=localStorage.getItem(this.key);this.pending=null;
  if(raw&&this.writer){const p=JSON.parse(raw);assert(p.household===data.household.id&&typeof p.mutation==='string'&&Number.isSafeInteger(p.revision),'El cambio pendiente no es válido. Conserva una copia del navegador antes de continuar.');validateState(p.state);this.pending=p;}
  state=this.restore(this.pending?.state||data.household.state);state.updatedAt=data.household.updated_at;storageProblem='';this.gated=false;this.phase='ready';this.notice='';render();if(this.pending&&!this.pending.conflict)this.flush();
 },
 async session(session){
  const user=session?.user||null;if(user?.id===this.user?.id&&['login','onboarding','ready'].includes(this.phase))return;
  const epoch=++this.epoch;this.release?.();this.release=null;this.writer=false;this.user=user;this.household=null;this.pending=null;this.deferred=null;this.busy=false;this.reading=false;this.gated=true;this.phase=user?'loading':'login';this.error='';
  if($('#dialog').open)closeModal();state=initialState();$('#print-report').innerHTML='';render();
  if(!user)return;
  try{const data=await this.rpc('finance_bootstrap');if(epoch!==this.epoch)return;if(data.household)await this.attach(data);else{this.phase='onboarding';render();}}
  catch(e){if(epoch===this.epoch){this.phase='error';this.error=e.message;render();}}
 },
 async start(){
  if(!this.enabled){this.gated=false;return;}
  this.local=clone(state);render();
  try{
   const config=window.FINANZAS_CLOUD,url=new URL(config.url);
   assert(url.protocol==='https:'&&/^[a-z0-9-]+\.supabase\.co$/.test(url.hostname),'Configura una URL HTTPS válida de tu proyecto Supabase en config.js.');
   assert(typeof config.publishableKey==='string'&&config.publishableKey.startsWith('sb_publishable_'),'Usa la clave pública que empieza por sb_publishable_ en config.js. Nunca una clave secret o service_role.');
   assert(window.supabase?.createClient,'Falta el archivo vendor de Supabase. Copia también la carpeta vendor.');
   this.project=url.hostname;this.client=window.supabase.createClient(url.origin,config.publishableKey,{auth:{storageKey:'finanzas-auth:'+this.project,detectSessionInUrl:false}});
   this.client.auth.onAuthStateChange((event,session)=>{setTimeout(()=>this.session(session),0);});
   const {data,error}=await this.client.auth.getSession();if(error)throw error;await this.session(data.session);
   setInterval(()=>this.poll(),5000);window.addEventListener('online',()=>this.poll());window.addEventListener('focus',()=>this.poll());
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.poll();});
  }catch(e){this.phase='error';this.error=e.message;render();}
 },
 gate(){
  document.body.classList.add('cloud-gated');$('#sidebar').innerHTML='';$('#topbar').innerHTML='';$('#storage-alert').textContent='';
  let body='';
  if(this.phase==='loading')body='<p role="status">Conectando con tu hogar…</p>';
  if(this.phase==='error')body='<p class="negative" role="alert">'+escapeHtml(this.error)+'</p><p class="field-note">Revisa la configuración y la conexión. Tus datos locales se conservan.</p><button class="btn section-space" data-cloud="reload">Volver a intentar</button>';
  if(this.phase==='login')body='<p class="muted">Entren con sus propios correos para ver las mismas cajas y movimientos.</p><form id="cloud-login" class="section-space cloud-form"><label>Correo<input type="email" name="email" autocomplete="username" required></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label><div class="form-error" role="alert"></div><button class="btn" type="submit">Entrar a mi hogar</button></form><p class="field-note">Las dos cuentas se crean en Supabase durante la configuración. Si olvidaste tu contraseña, el administrador del proyecto debe restablecerla.</p>';
  if(this.phase==='onboarding')body='<p class="muted">Conecta este correo con el hogar que compartirán.</p><section class="section-space"><h2>Si eres el primero en entrar</h2><p class="field-note">Elige una copia JSON exportada desde la app anterior. Sin archivo, se usarán los datos originales de este navegador ('+(this.local?.transactions.length||0)+' movimientos). Nada se sube hasta confirmar.</p><form id="cloud-create" class="cloud-form section-space"><label>Nombre del hogar<input name="name" maxlength="80" value="'+escapeHtml(this.local?.settings.couple||'Nuestro hogar')+'" required></label><label>Copia de seguridad (opcional)<input name="backup" type="file" accept=".json,application/json"></label><label class="check"><input type="checkbox" required>Confirmo que esta es la copia que quiero compartir.</label><div class="form-error" role="alert"></div><button class="btn" type="submit">Crear hogar con esta copia</button></form></section><div class="divider"></div><h2>Si tu pareja ya creó el hogar</h2><form id="cloud-join" class="cloud-form section-space"><label>Código de invitación<input name="token" autocomplete="off" maxlength="128" required></label><div class="form-error" role="alert"></div><button class="btn secondary" type="submit">Unirme al hogar</button></form>';
  $('#main').innerHTML='<div class="cloud-gate card"><span class="eyebrow">FINANCE</span><h1>Un hogar, en los dos celulares.</h1>'+body+(this.user?'<button class="link-btn section-space" data-cloud="logout">Cerrar sesión</button>':'')+'</div>';
 },
 account(){
  if(!this.enabled){openModal('Conectar los dos dispositivos','<p>La app está preparada para Supabase. Completa <strong>config.js</strong> con la URL y la clave pública de tu proyecto, ejecuta <strong>supabase/schema.sql</strong> y crea las dos cuentas siguiendo <strong>LEEME-SUPABASE.md</strong>.</p><p class="field-note">Por ahora, los cambios solo se guardan en este navegador. Exporta una copia JSON antes de pasar a GitHub Pages.</p>','Entendido',()=>{});return;}

 },
 download(){assert(this.pending,'No hay un cambio pendiente.');download(JSON.stringify(this.pending.state,null,2),'cambio-pendiente-'+today()+'.json','application/json');},
 async resolve(){
  assert(this.pending?.conflict&&!this.busy,'Primero espera la respuesta del servidor.');
  confirmModal('Conservar copia y abrir los datos compartidos','Se descargará tu cambio pendiente como respaldo y se abrirá la versión guardada del hogar. Revisa esa copia y vuelve a registrar únicamente lo que falte. No se combinarán ni duplicarán movimientos automáticamente.',async()=>{
   const epoch=this.epoch,data=await this.rpc('finance_bootstrap');if(epoch!==this.epoch)return false;assert(data.household?.id===this.household.id,'No se pudo verificar el hogar.');validateState(data.household.state);

 'delete-transaction':el=>deleteTransaction(el.dataset.id),
 'redirect-goal':redirectCurrent,
 'view-goals':()=>navigate('goals'),
 'allocate':el=>allocateAvailable(el.dataset.fund),
 'stable-plan':activateStablePlan,
 'new-month':newMonthForm,
 'copy-month':copyPrevious,
 'activate-month':()=>{ensureOpen();commit(()=>{month().status='active';},'Mes marcado en curso.');},
 'close-month':closeMonthDialog,
 'reopen-month':()=>confirmModal('Reabrir '+monthName(state.selectedMonth),'Se reabrirá el mes para editar sus movimientos. En caja real, los ingresos y su reparto se conservan; no se retira dinero al reabrir.',()=>commit(()=>reopenMonth(state.selectedMonth),'Mes reabierto.'),'Reabrir mes'),
 'reset-month':()=>{ensureOpen();confirmModal('Restablecer el presupuesto','Se recuperarán los importes iniciales de este mes. Los movimientos registrados se conservarán.',()=>commit(()=>{const m=newMonth(state.selectedMonth);m.budget.goals=Object.fromEntries(Object.entries(m.budget.goals).filter(([id])=>goal(id)));const old=month();old.income=m.income;old.extra=m.extra;old.incomeMode=m.incomeMode;old.budget=m.budget;old.essentials=m.essentials;old.stable=false;old.redirected=null;},'Presupuesto restablecido.'),'Restablecer',true);},
 'reset-simulator':()=>{resetSimulation();render();},
 'sim-preset':el=>{simulator.income=Number(el.dataset.value);render();},
 'export-json':exportJSON,
 'export-csv':exportCSV,
 'import-json':()=>$('#import-file').click(),
 'print':()=>{buildPrintReport();window.print();},
 'reset-all':()=>confirmModal('Borrar todos los datos','Se eliminará toda la información guardada '+(cloud.enabled?'del hogar compartido, para ambos':'en este navegador')+' y volverá el presupuesto inicial. Primero se descargará una copia automática de tus datos actuales.',()=>{exportJSON();const next=initialState();if(cloud.enabled){const before=state;try{state=next;cloud.record(before,state);simulator=null;page='home';render();toast('Reinicio pendiente de sincronizar.');return;}catch(e){state=before;throw e;}}try{localStorage.setItem(APP_KEY,JSON.stringify(next));}catch(e){throw Error('No se pudo completar el reinicio. Tus datos siguen en esta sesión.');}state=next;storageProblem='';simulator=null;transactionFilters={month:'current',type:'',category:'',person:''};page='home';render();toast('Datos reiniciados.');},'Borrar y reiniciar',true)
};
function navigate(next){if(!navItems.some(n=>n[0]===next))return;page=next;$('#sidebar').classList.remove('open');$('#menu-shade').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}
function changeMonth(key){if(!state.months[key])return;state.selectedMonth=key;simulator=null;save();render();}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return;}const el=event.target.closest('[data-action]');if(el){try{actions[el.dataset.action]?.(el);}catch(e){toast(e.message,true);}}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='month-select')changeMonth(el.value);if(el.dataset.filter){transactionFilters[el.dataset.filter]=el.value;render();}});
$('#menu-shade').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#menu-shade').classList.remove('open');});
$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const rect=$('#dialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
$('#dialog').addEventListener('cancel',()=>{modalSubmit=null;});
$('#import-file').addEventListener('change',async event=>{try{await importFile(event.target.files[0]);}catch(e){toast(e.message,true);}finally{event.target.value='';}});
/* Forms preview calculations while typing; submitted valid edits save immediately. */
document.addEventListener('input',event=>{
 const form=event.target.closest('form');if(!form)return;
 if(form.id==='budget-form'){try{const m=budgetFromForm(form);$('#budget-summary').innerHTML=budgetSummary(totals(state.selectedMonth,state,m));$('.form-error',form).textContent='';}catch{}}
 if(form.id==='simulator-form'){const name=event.target.name;try{simulator[name]=cents(event.target.value);$('#simulation-output').innerHTML=simulationOutput();event.target.setCustomValidity('');}catch{event.target.setCustomValidity('Escribe un monto válido, sin negativos y con hasta 2 decimales.');}}
 if(form.id==='equipment-form'){try{const fd=new FormData(form);$('#equipment-dec').textContent=money(sum(state.equipment.map(e=>cents(fd.get('dec_'+e.id)))));$('#equipment-jan').textContent=money(sum(state.equipment.map(e=>cents(fd.get('jan_'+e.id)))));}catch{}}
});
document.addEventListener('submit',event=>{
 const form=event.target;if(form.id==='modal-form')return;event.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form);
 try{
  if(form.id==='budget-form'){ensureOpen();const edited=budgetFromForm(form);commit(()=>{state.months[state.selectedMonth]=edited;},'Presupuesto guardado. Todas las cifras están actualizadas.');}
  if(form.id==='equipment-form'){const values=state.equipment.map(e=>({...e,dec:cents(fd.get('dec_'+e.id)),jan:cents(fd.get('jan_'+e.id))}));commit(()=>{state.equipment=values;},'Distribución guardada.');}
  if(form.id==='gas-form'){ensureOpen();const value=cents(fd.get('weekly'));commit(()=>{month().budget.gas=Math.round(value*52/12);},'Presupuesto de gasolina actualizado.');}
  if(form.id==='essentials-form'){ensureOpen();commit(()=>{month().essentials=fd.getAll('essentials').filter(x=>expenseKeys.includes(x));},'Gastos esenciales actualizados.');}
  if(form.id==='opening-form'){assert(!Object.values(state.months).some(m=>m.status==='closed'),'Reabre los meses cerrados antes de cambiar los saldos iniciales.');const opening=Object.fromEntries(fundKeys.map(f=>[f,cents(fd.get(f))]));commit(()=>{state.initialFunds=opening;},'Saldos iniciales guardados.');}
  if(form.id==='settings-form'){const names=[fd.get('name1').trim(),fd.get('name2').trim()],couple=fd.get('couple').trim();assert(names.every(Boolean)&&couple,'Completa los nombres.');const limit=cents(fd.get('limit'));commit(()=>{state.settings={...state.settings,names,couple,limit,theme:fd.get('theme'),format:fd.get('format'),sameIess:fd.has('sameIess'),autoRedirect:fd.has('autoRedirect')};},'Configuración guardada.');}
 }catch(e){const error=$('.form-error',form);if(error)error.textContent=e.message;else toast(e.message,true);}
});
window.addEventListener('beforeprint',buildPrintReport);
/* Do not silently overwrite changes made from another tab. */
window.addEventListener('storage',event=>{if(cloud.enabled)return;if(event.key===APP_KEY&&event.newValue){try{const incoming=migrateState(JSON.parse(event.newValue));state=incoming;simulator=null;render();if($('#dialog').open)closeModal();toast('Datos actualizados desde otra pestaña.');}catch{toast('Otra pestaña guardó datos que no se pudieron recuperar.',true);}}});
state=loadState();
render();
if(!state.updatedAt&&!storageProblem){save();render();}
// Expose only the immutable calculation helpers for diagnostics, not live state.
window.NuestroPresupuesto={version:VERSION,snapshot:()=>clone(state),totals:()=>clone(totals()),validateBackup:value=>{migrateState(value);return true;}};
cloud.start();

</script>
<!-- END_APPLICATION_SCRIPT -->
</body>
</html>
